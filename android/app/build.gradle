apply plugin: 'com.android.application'

def firebaseEnvironment = System.getenv('CAPACITOR_ENV') ?: 'staging'
if (!(firebaseEnvironment in ['staging', 'production'])) {
    throw new GradleException('CAPACITOR_ENV must be staging or production')
}
def stagingFirebase = firebaseEnvironment == 'staging'
def firebaseAppId = stagingFirebase ? 'com.fertiliapp.fertiliapp.staging' : 'com.fertiliapp.fertiliapp'

android {
    namespace "com.fertiliapp.fertiliapp"
    compileSdkVersion rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId firebaseAppId
        manifestPlaceholders = [fertiliAppLabel: stagingFirebase ? 'FertiliApp Pruebas' : '@string/app_name']
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Capacitor sync does not update applicationId in an existing native project.
// Refuse stale generated assets before packaging an APK for either environment.
tasks.register('verifyFirebaseEnvironment') {
    doLast {
        def configFile = file('src/main/assets/capacitor.config.json')
        if (!configFile.exists()) throw new GradleException('Run the matching web build and cap sync android first')
        def config = new groovy.json.JsonSlurper().parse(configFile)
        def expectedUrl = stagingFirebase ? 'https://fertiliapp-staging.web.app' : 'https://rnf-app.web.app'
        if (config.appId != firebaseAppId || config.server?.url != expectedUrl) {
            throw new GradleException('Capacitor assets do not match CAPACITOR_ENV; rebuild and sync explicitly')
        }
        if (stagingFirebase) {
            def manifestFile = file('src/main/assets/public/staging-build.json')
            if (!manifestFile.exists()) throw new GradleException('Staging web build is missing from Android assets')
            def manifest = new groovy.json.JsonSlurper().parse(manifestFile)
            if (manifest.projectId != 'fertiliapp-staging') throw new GradleException('Wrong Firebase project in Android assets')
        }
    }
}
preBuild.dependsOn('verifyFirebaseEnvironment')

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
