name: Validate staging on PR (no deployment)
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:staging
      - run: npm run test:experiment
      - name: Compile staging with synthetic config (never deployed)
        run: npm run build:staging
        env:
          VITE_APP_ENV: staging
          VITE_FIREBASE_API_KEY: synthetic-key-for-build-only
          VITE_FIREBASE_AUTH_DOMAIN: fertiliapp-staging.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: fertiliapp-staging
          VITE_FIREBASE_STORAGE_BUCKET: ''
          VITE_FIREBASE_MESSAGING_SENDER_ID: '574564111406'
          VITE_FIREBASE_APP_ID: '1:574564111406:web:e49df0e56568b3a4f4fbbf'
          VITE_FIREBASE_MEASUREMENT_ID: ''
          VITE_ENABLE_ANALYTICS: 'false'
